/* ===== 主题切换按钮（亮色模式）===== */
.theme-toggle-wrapper {
    position: fixed;
    top: 1.5rem;
    right: 1.5rem;
    z-index: 1000;
}

.theme-toggle {
    background: #fff5e6;
    border: 1px solid #dee2e6;
    border-radius: 40px;
    padding: 0.5rem;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: all 0.3s ease;
    font-size: 1.4rem;
    color: #5aba47;
}

.theme-toggle:hover {
    transform: scale(1.05);
}

/* 主题切换按钮（暗黑模式）*/
body[data-theme="dark"] .theme-toggle {
    background: #1e2228 !important;
    border-color: #3a4048 !important;
    color: #7fdf5e !important;
}

.light-icon, .dark-icon {
    position: absolute;
    transition: opacity 0.3s, transform 0.3s;
}

[data-theme="light"] .light-icon,
[data-theme="dark"] .dark-icon {
    opacity: 1;
    transform: scale(1);
}

[data-theme="light"] .dark-icon,
[data-theme="dark"] .light-icon {
    opacity: 0;
    transform: scale(0.5);
}

/* 移动端主题按钮适配 */
@media (max-width: 768px) {
    .theme-toggle-wrapper {
        top: 1rem;
        right: 1rem;
    }
    .theme-toggle {
        width: 42px;
        height: 42px;
        font-size: 1.2rem;
    }
}

@media (max-width: 576px) {
    .theme-toggle {
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
        padding: 0.4rem;
    }
}

@media (orientation: landscape) and (max-height: 600px) {
    .theme-toggle-wrapper {
        top: 0.8rem;
        right: 0.8rem;
    }
}

@media print {
    .theme-toggle-wrapper {
        display: none;
    }
}

        let currentLang = 'zh-CN';
        
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('success-title').textContent = langTexts[lang].successTitle;
            document.querySelector('.table-caption').innerHTML = langTexts[lang].caption;
            document.getElementById('header-problem').textContent = langTexts[lang].headerProblem;
            document.getElementById('header-solution').textContent = langTexts[lang].headerSolution;
            document.getElementById('problem1').textContent = langTexts[lang].problem1;
            document.getElementById('solution1').innerHTML = langTexts[lang].solution1;
            document.getElementById('problem2').textContent = langTexts[lang].problem2;
            document.getElementById('solution2').innerHTML = langTexts[lang].solution2;
            document.getElementById('problem3').textContent = langTexts[lang].problem3;
            document.getElementById('solution3').innerHTML = langTexts[lang].solution3;
            document.getElementById('problem4').textContent = langTexts[lang].problem4;
            document.getElementById('solution4').innerHTML = langTexts[lang].solution4;
            document.getElementById('problem5').textContent = langTexts[lang].problem5;
            document.getElementById('solution5').innerHTML = langTexts[lang].solution5;
            document.getElementById('currentTimetext').textContent = langTexts[lang].currentTimetext;
            document.getElementById('footertext').textContent = langTexts[lang].footertext;
            updateDateTime();
        }
        
        function updateDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');
            const second = String(now.getSeconds()).padStart(2, '0');
            const format = langTexts[currentLang].dateTimeFormat;
            document.getElementById('currentDateTime').textContent = format(year, month, day, hour, minute, second);
        }
        
        // 主题切换功能
        function initTheme() {
            const savedTheme = localStorage.getItem('hestia-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme) {
                document.body.setAttribute('data-theme', savedTheme);
            } else {
                document.body.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            }
        }
        
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('hestia-theme', newTheme);
        }
        
        function setupThemeListener() {
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            const handler = (e) => {
                if (!localStorage.getItem('hestia-theme')) {
                    document.body.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                }
            };
            
            if (mediaQuery.addEventListener) {
                mediaQuery.addEventListener('change', handler);
            } else {
                mediaQuery.addListener(handler);
            }
        }
        
        window.onload = function() {
            updateDateTime();
            setInterval(updateDateTime, 1000);
            changeLanguage('zh-CN');
            
            initTheme();
            setupThemeListener();
            
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', toggleTheme);
                themeToggle.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggleTheme();
                    }
                });
            }
        };
        
        var protocol = window.location.protocol;
        var hostname = window.location.hostname;
        var port = window.location.port ? ':' + window.location.port : '';
        var rootUrl = protocol + '//' + hostname + port;
        document.getElementById('rootUrlLink').textContent = rootUrl;
        document.getElementById('rootUrlLink').href = rootUrl;
    </script>
