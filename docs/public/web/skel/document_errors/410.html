<script>
	function updateDateTime() {
		const now = new Date();
		const year = now.getFullYear();
		const month = String(now.getMonth() + 1).padStart(2, '0');
		const day = String(now.getDate()).padStart(2, '0');
		const hour = String(now.getHours()).padStart(2, '0');
		const minute = String(now.getMinutes()).padStart(2, '0');
		const second = String(now.getSeconds()).padStart(2, '0');
		const formattedDateTime = `${year}年${month}月${day}日 ${hour}:${minute}:${second}`;
		document.getElementById('currentDateTime').textContent = formattedDateTime;
	}
	window.onload = function() {
		updateDateTime();
		setInterval(updateDateTime, 1000);
	};
</script> 
<script>
	function animateBackground() {
		const overlay = document.getElementById('colorOverlay');
		let hue = 0;
		
		function updateColor() {
			hue = (hue + 0.6) % 360;
			overlay.style.backgroundColor = `hsla(${hue}, 80%, 50%, 1)`;
			requestAnimationFrame(updateColor);
		}
		updateColor();
	}

	window.onload = function() {
		updateDateTime();
		setInterval(updateDateTime, 1000);
		animateBackground(); 
	};
    (function () {
        function ready(fn) {
            if (document.readyState != 'loading') {
                fn();
            } else {
                document.addEventListener('DOMContentLoaded', fn);
            }
        }

        function makeSnow(el) {
            var ctx = el.getContext('2d');
            var width = 0;
            var height = 0;
            var particles = [];

            var Particle = function () {
                this.x = this.y = this.dx = this.dy = 0;
                this.angle = Math.random() * Math.PI * 2;
                this.rotation = (Math.random() - 0.5) * 0.1;
                this.size = Math.random() * 4 + 3;
                this.points = 5 + Math.floor(Math.random() * 3);
                this.reset();
            }

            Particle.prototype.reset = function () {
                this.y = Math.random() * -height;
                this.x = Math.random() * width;
                this.dx = (Math.random() * 2) - 1;
                this.dy = (Math.random() * 1.5) + 1.2;
            }

            function createParticles(count) {
                particles = [];
                for (var i = 0; i < count; i++) {
                    particles.push(new Particle());
                }
            }

            function drawStar(ctx, particle) {
                ctx.save();
                ctx.translate(particle.x, particle.y);
                ctx.rotate(particle.angle);
                ctx.fillStyle = '#f6f9fa';
                
                const outerRadius = particle.size;
                const innerRadius = outerRadius * 0.5;
                const step = Math.PI / particle.points;
                
                ctx.beginPath();
                for(let i = 0; i < 2 * particle.points; i++){
                    const radius = i % 2 === 0 ? outerRadius : innerRadius;
                    const x = radius * Math.cos(i * step);
                    const y = radius * Math.sin(i * step);
                    if(i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }

            function onResize() {
                width = window.innerWidth;
                height = window.innerHeight;
                el.width = width;
                el.height = height;
                createParticles((width * height) / 7000);
            }

            function updateParticles() {
                ctx.clearRect(0, 0, width, height);

                particles.forEach(function (particle) {
                    particle.y += particle.dy;
                    particle.x += particle.dx;
                    particle.angle += particle.rotation;

                    if (particle.y > height + 100 || 
                        particle.x < -100 || 
                        particle.x > width + 100) {
                        particle.reset();
                    }

                    drawStar(ctx, particle);
                });

                window.requestAnimationFrame(updateParticles);
            }

            onResize();
            window.addEventListener('resize', onResize);
            updateParticles();
        }

        ready(function () {
            var canvas = document.getElementById('snow');
            makeSnow(canvas);
        });
    })();
</script>
